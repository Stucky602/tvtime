# Architecture ref: ARCHITECTURE_v1.0.md §10
#
# Builds the PWA and publishes it to GitHub Pages on every push to main.
#
# One-time setup after this file lands in the repo:
#   1. Settings -> Pages -> Build and deployment -> Source ->
#      "GitHub Actions"
#   2. Settings -> Secrets and variables -> Actions -> New repository
#      secret. Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (from
#      Supabase dashboard -> Project Settings -> API). Both are safe as
#      plain repo secrets even though they're not confidential -- RLS is
#      the real gate (see the RLS section above) -- there's just no
#      simpler place to keep them than alongside the rest.
#
# This comment used to say "no secrets needed for this workflow." That
# was true back when this file was written (component 1, before
# Supabase was wired in at all) and has been wrong since component 9
# started reading import.meta.env.VITE_SUPABASE_* at build time -- Vite
# bakes those values in during `npm run build`, so without them here the
# deployed app builds successfully but shows "Not configured" forever.
# Caught by checking this file against what the code actually needs
# rather than trusting the original comment.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The keep-warm job commits a timestamp here every four days. Without
    # this, each heartbeat triggered a full rebuild and redeploy of
    # completely unchanged code -- and because this workflow uses
    # cancel-in-progress, a heartbeat landing shortly after a real push
    # would cancel that push's deploy outright.
    paths-ignore:
      - '.github/heartbeat.txt'
  # Lets you trigger a redeploy by hand from the Actions tab without
  # needing a new commit -- useful right after changing Pages settings.
  workflow_dispatch:

# Least-privilege: this workflow only ever needs to read the repo and
# write to the Pages deployment, never full repo write access.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment in flight at a time, and IN-PROGRESS DEPLOYS ARE
# NEVER CANCELLED.
#
# This used to be cancel-in-progress: true, on the reasoning that a
# newer build should win. That reasoning is right for most jobs and
# wrong for this one, and it is what left a deploy polling
# "updating_pages" forever.
#
# The deploy-pages action does not just upload: it registers a
# deployment with the Pages backend and then polls until Pages reports
# it finished. Kill the job partway and the runner stops polling, but
# the deployment it registered is still sitting on GitHub's side. The
# next run then queues behind a deployment that nobody is driving any
# more, and waits until it times out.
#
# GitHub's own Pages starter workflow uses false for exactly this
# reason. Queuing costs a couple of minutes; cancelling costs a wedged
# Pages state that has to be cleared by hand.
#
# The reason for wanting newest-wins has also gone: heartbeat commits no
# longer trigger this workflow at all (see paths-ignore above), so
# back-to-back deploys of identical code should not happen any more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
